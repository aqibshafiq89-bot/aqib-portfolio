name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v6
      - name: Generate static portfolio
        run: python3 scripts/build.py
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Set canonical URL for this deployment
        env:
          PORTFOLIO_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/set-site-url.py "$PORTFOLIO_BASE_URL"
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
